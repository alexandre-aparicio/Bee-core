services:
  bee-db:
    image: postgres:16-alpine
    container_name: bee-core-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: bee_core
      POSTGRES_USER: bee_core
      POSTGRES_PASSWORD: ${BEE_DB_PASSWORD:?Set BEE_DB_PASSWORD in .env}
    volumes:
      - bee_core_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bee_core -d bee_core"]
      interval: 10s
      timeout: 5s
      retries: 5

  bee-core:
    build: .
    container_name: bee-core
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      AUTH_ADMIN_EMAIL: ${AUTH_ADMIN_EMAIL:-}
      AUTH_ADMIN_PASSWORD: ${AUTH_ADMIN_PASSWORD:-}
      DATABASE_URL: postgres://bee_core:${BEE_DB_PASSWORD}@bee-db:5432/bee_core
    depends_on:
      bee-db:
        condition: service_healthy
    ports:
      - "${BEE_CORE_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 3

volumes:
  bee_core_pgdata:
