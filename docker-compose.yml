services:
  mongodb:
    image: mongo:7.0
    container_name: bee-core-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: bee_core
    volumes:
      - bee_core_mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  bee-core:
    build: .
    container_name: bee-core
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      AUTH_ADMIN_EMAIL: ${AUTH_ADMIN_EMAIL:-}
      AUTH_ADMIN_PASSWORD: ${AUTH_ADMIN_PASSWORD:-}
      AUTH_MFA_ENCRYPTION_KEY: ${AUTH_MFA_ENCRYPTION_KEY:?Set AUTH_MFA_ENCRYPTION_KEY in .env}
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DB: ${MONGODB_DB:-bee_core}
      BEE_FILES_DIR: /data/bee-files
    volumes:
      - bee_core_files:/data/bee-files
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "${BEE_CORE_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 3

  web:
    build:
      context: ./apps/web
      args:
        VITE_BEE_API: /api
    container_name: bee-core-web
    restart: unless-stopped
    depends_on:
      bee-core:
        condition: service_healthy
    ports:
      - "${BEE_WEB_PORT:-8080}:80"

volumes:
  bee_core_mongodb_data:
  bee_core_files:
