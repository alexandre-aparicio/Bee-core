name: Plugin UI validation

on:
  push:
    branches:
      - design/plugin-catalogue-teams-layout
  pull_request:
    branches:
      - main
    paths:
      - "apps/web/**"
      - ".github/workflows/plugin-ui-validation.yml"

permissions:
  contents: read

concurrency:
  group: plugin-ui-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  angular-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web dependencies
        run: npm ci
      - name: Build Angular application
        run: npm run build
      - name: Validate Playwright test discovery
        run: npm run test:e2e -- --list
