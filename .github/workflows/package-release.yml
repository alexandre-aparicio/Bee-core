name: Build signed module packages

on:
  push:
    branches:
      - refactor/time-tracking-connected-devices-architecture
  workflow_dispatch:
    inputs:
      runtime_version:
        description: Bee Core runtime version required by the packages
        required: true
        default: "0.3.1"

permissions:
  contents: read

jobs:
  packages:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BEE_PLUGIN_PUBLISHER_PRIVATE_KEY: ${{ secrets.BEE_PLUGIN_PUBLISHER_PRIVATE_KEY }}
      BEE_RUNTIME_VERSION: ${{ inputs.runtime_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install backend dependencies
        run: npm ci
      - name: Install web dependencies for the federation remote
        run: npm ci --prefix apps/web
      - name: Build backend and Native Federation remotes
        run: |
          npm run build
          node scripts/build-connected-devices-remote.mjs
          node scripts/build-time-tracking-remote.mjs
      - name: Build and verify signed ZIP packages
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$BEE_PLUGIN_PUBLISHER_PRIVATE_KEY" ]]; then
            echo "::error::Configure the BEE_PLUGIN_PUBLISHER_PRIVATE_KEY repository secret to generate installable signed ZIP packages."
            exit 1
          fi
          mkdir -p secrets
          trap 'rm -rf secrets' EXIT
          printf '%s\n' "$BEE_PLUGIN_PUBLISHER_PRIVATE_KEY" > secrets/plugin-publisher-private.pem
          openssl pkey -in secrets/plugin-publisher-private.pem -pubout -out secrets/plugin-publisher-public.pem
          node scripts/build-plugin-packages.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: bee-core-first-party-plugin-packages
          path: artifacts/plugin-packages/*.zip
          if-no-files-found: error
          retention-days: 14
