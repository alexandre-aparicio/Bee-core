name: Bee-Core Production Compose CI

on:
  pull_request:
    paths:
      - "Dockerfile"
      - "docker-compose*.yml"
      - ".env.production.example"
      - "docker/**"
      - "apps/web/Dockerfile"
      - "apps/web/nginx.conf"
      - "apps/web/package*.json"
      - "package*.json"
      - "src/**"
      - "apps/web/**"
      - ".github/workflows/docker-prod-profile.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-compose:
    name: Clean install, private ports, persistence and backup/restore
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Create isolated production environment
        shell: bash
        run: |
          set -euo pipefail
          cat > .env <<EOF
          BEE_WEB_PORT=127.0.0.1:3011
          TRUST_PROXY=false
          PUBLIC_BASE_DOMAIN=bee-core-ci.example.test
          MONGODB_DB=bee_core
          JWT_SECRET=$(openssl rand -hex 48)
          AUTH_ADMIN_EMAIL=ci-admin@example.test
          AUTH_ADMIN_PASSWORD=$(openssl rand -hex 20)
          AUTH_MFA_ENCRYPTION_KEY=$(openssl rand -base64 32)
          MONGO_ROOT_USERNAME=root
          MONGO_ROOT_PASSWORD=$(openssl rand -hex 32)
          MONGO_APP_USERNAME=bee_core_app
          MONGO_APP_PASSWORD=$(openssl rand -hex 32)
          BEE_MAIL_ENCRYPTION_KEY=$(openssl rand -hex 32)
          BEE_MAIL_SYNC_INTERVAL_SECONDS=300
          EOF
          chmod 600 .env
          set -a
          . ./.env
          set +a
          {
            echo "MONGO_ROOT_USERNAME=$MONGO_ROOT_USERNAME"
            echo "MONGO_ROOT_PASSWORD=$MONGO_ROOT_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: Validate production Compose merge and host-port isolation
        shell: bash
        run: |
          set -euo pipefail
          docker compose -p bee-core-ci -f docker-compose.yml -f docker-compose.prod.yml config --format json > /tmp/bee-core-compose.json
          python3 - <<'PY'
          import json
          with open("/tmp/bee-core-compose.json", encoding="utf-8") as stream:
              config = json.load(stream)
          services = config["services"]
          assert not services["mongodb"].get("ports"), "MongoDB must not publish host ports"
          assert not services["bee-core"].get("ports"), "API must not publish host ports"
          web_ports = services["web"].get("ports", [])
          assert len(web_ports) == 1, "Only the web entry point may publish a host port"
          assert str(web_ports[0].get("published")) == "3011", web_ports
          assert web_ports[0].get("host_ip") == "127.0.0.1", web_ports
          assert "bee_core_mongodb_data" in config.get("volumes", {})
          assert "bee_core_files" in config.get("volumes", {})
          print("Production Compose merge is valid; only loopback web port 3011 is published.")
          PY
      - name: Build and start a clean production stack
        run: |
          docker compose -p bee-core-ci -f docker-compose.yml -f docker-compose.prod.yml up -d --build --wait
      - name: Verify web/API health and MongoDB/file persistence
        shell: bash
        run: |
          set -euo pipefail
          source .env
          curl --fail --silent --show-error --retry 30 --retry-connrefused --retry-delay 2 http://127.0.0.1:3011/ > /dev/null
          curl --fail --silent --show-error --retry 30 --retry-connrefused --retry-delay 2 http://127.0.0.1:3011/api/health
          docker compose -p bee-core-ci -f docker-compose.yml -f docker-compose.prod.yml exec -T bee-core sh -lc 'printf "bee-core-ci-persisted\n" > /data/bee-files/.ci-persistence-sentinel'
          docker compose -p bee-core-ci -f docker-compose.yml -f docker-compose.prod.yml exec -T mongodb mongosh --quiet --username "$MONGO_ROOT_USERNAME" --password "$MONGO_ROOT_PASSWORD" --authenticationDatabase admin --eval "db.getSiblingDB('bee_core').ci_sentinel.insertOne({_id:'compose-persistence',value:'present'})"
          docker compose -p bee-core-ci -f docker-compose.yml -f docker-compose.prod.yml restart mongodb bee-core
          docker compose -p bee-core-ci -f docker-compose.yml -f docker-compose.prod.yml up -d --wait
          curl --fail --silent --show-error --retry 30 --retry-connrefused --retry-delay 2 http://127.0.0.1:3011/api/health
          docker compose -p bee-core-ci -f docker-compose.yml -f docker-compose.prod.yml exec -T bee-core test -f /data/bee-files/.ci-persistence-sentinel
          docker compose -p bee-core-ci -f docker-compose.yml -f docker-compose.prod.yml exec -T mongodb mongosh --quiet --username "$MONGO_ROOT_USERNAME" --password "$MONGO_ROOT_PASSWORD" --authenticationDatabase admin --eval "if (!db.getSiblingDB('bee_core').ci_sentinel.findOne({_id:'compose-persistence'})) quit(2)"
      - name: Build pinned MongoDB Database Tools image
        run: docker build --pull -f docker/backup-tools.Dockerfile -t bee-core-mongodb-tools:ci .

      - name: Verify MongoDB and private-file backup artifacts
        shell: bash
        run: |
          set -euo pipefail
          source .env
          mkdir -p .ci-backups
          network=$(docker network ls --filter label=com.docker.compose.project=bee-core-ci --format '{{.Name}}' | grep '_default$' | head -n1)
          test -n "$network"
          docker run --rm --network "$network" -v "$PWD/.ci-backups:/backup" bee-core-mongodb-tools:ci mongodump --uri="mongodb://$MONGO_ROOT_USERNAME:$MONGO_ROOT_PASSWORD@mongodb:27017/bee_core?authSource=admin" --archive=/backup/bee-core.archive --gzip
          docker run --rm --volumes-from bee-core -v "$PWD/.ci-backups:/backup" alpine:3.20 tar czf /backup/bee-core-files.tar.gz -C /data/bee-files .
          test -s .ci-backups/bee-core.archive
          test -s .ci-backups/bee-core-files.tar.gz
          docker run --rm --network "$network" -v "$PWD/.ci-backups:/backup" bee-core-mongodb-tools:ci mongorestore --uri="mongodb://$MONGO_ROOT_USERNAME:$MONGO_ROOT_PASSWORD@mongodb:27017/bee_core_restore?authSource=admin" --archive=/backup/bee-core.archive --gzip --nsInclude='bee_core.*' --nsFrom='bee_core.*' --nsTo='bee_core_restore.*'
          docker compose -p bee-core-ci -f docker-compose.yml -f docker-compose.prod.yml exec -T mongodb mongosh --quiet --username "$MONGO_ROOT_USERNAME" --password "$MONGO_ROOT_PASSWORD" --authenticationDatabase admin --eval "if (!db.getSiblingDB('bee_core_restore').ci_sentinel.findOne({_id:'compose-persistence'})) quit(2)"
      - name: Capture container diagnostics on failure
        if: failure()
        run: |
          docker compose -p bee-core-ci -f docker-compose.yml -f docker-compose.prod.yml ps -a
          docker compose -p bee-core-ci -f docker-compose.yml -f docker-compose.prod.yml logs --no-color --tail=200

      - name: Stop stack and remove test volumes
        if: always()
        run: docker compose -p bee-core-ci -f docker-compose.yml -f docker-compose.prod.yml down -v --remove-orphans
