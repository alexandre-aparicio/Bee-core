name: Bee-Core production Compose profile

on:
  pull_request:
    paths:
      - "docker-compose.yml"
      - "docker-compose.prod.yml"
      - ".env.production.example"
      - ".github/workflows/docker-prod-profile.yml"
      - "Dockerfile"
      - "apps/web/Dockerfile"
      - "src/**"
  push:
    branches: [main, fix/compose-mongodb-authenticated-backup]
    paths:
      - "docker-compose.yml"
      - "docker-compose.prod.yml"
      - ".env.production.example"
      - ".github/workflows/docker-prod-profile.yml"
      - "Dockerfile"
      - "apps/web/**"
      - "src/**"
  workflow_dispatch:

jobs:
  production-compose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Configure isolated production environment
        run: |
          cp .env.production.example .env
          sed -i 's|^JWT_SECRET=.*|JWT_SECRET='"$(openssl rand -hex 48)"'|' .env
          sed -i 's|^AUTH_ADMIN_EMAIL=.*|AUTH_ADMIN_EMAIL=ci-admin@example.test|' .env
          sed -i 's|^AUTH_ADMIN_PASSWORD=.*|AUTH_ADMIN_PASSWORD=CI-Admin-Password-2026!|' .env
          sed -i 's|^BEE_MAIL_ENCRYPTION_KEY=.*|BEE_MAIL_ENCRYPTION_KEY='"$(openssl rand -hex 32)"'|' .env
          sed -i 's|^BEE_WEB_PORT=.*|BEE_WEB_PORT=18080|' .env
          chmod 600 .env

      - name: Validate production Compose exposure
        run: |
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config --format json > compose.json
          jq -e '
            ((.services.mongodb.ports // []) | length == 0) and
            ((.services["bee-core"].ports // []) | length == 0) and
            ((.services.web.ports // []) | length == 1) and
            ((.services.web.ports[0].published | tostring) == "18080")
          ' compose.json

      - name: Build and launch production overlay
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build

      - name: Verify web and internal API health
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18080/ >/dev/null; then
              echo "Web smoke test passed"
              break
            fi
            sleep 3
          done
          curl -fsS http://127.0.0.1:18080/ >/dev/null
          docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T bee-core node -e "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"

      - name: Verify persistent data volumes exist
        run: |
          docker volume ls --format '{{.Name}}' | grep 'bee_core_mongodb_data'
          docker volume ls --format '{{.Name}}' | grep 'bee_core_files'

      - name: Verify authentication and MongoDB persistence across restart
        run: |
          set -euo pipefail
          set -a
          . ./.env
          set +a
          login_response=$(curl -fsS -X POST http://127.0.0.1:18080/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"ci-admin@example.test","password":"CI-Admin-Password-2026!","client":"dashboard"}')
          refresh_token=$(printf '%s' "$login_response" | jq -er '.refreshToken')
          test -n "$refresh_token"

          docker compose -f docker-compose.yml -f docker-compose.prod.yml restart mongodb
          for attempt in $(seq 1 30); do
            if docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T mongodb mongosh --quiet --username "$MONGO_ROOT_USERNAME" --password "$MONGO_ROOT_PASSWORD" --authenticationDatabase admin --eval 'db.adminCommand("ping").ok' | grep -q 1; then
              break
            fi
            sleep 2
          done
          docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T mongodb mongosh --quiet --username "$MONGO_ROOT_USERNAME" --password "$MONGO_ROOT_PASSWORD" --authenticationDatabase admin --eval 'db.adminCommand("ping").ok' | grep -q 1

          docker compose -f docker-compose.yml -f docker-compose.prod.yml restart bee-core
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18080/api/health >/dev/null; then
              break
            fi
            sleep 2
          done

          refreshed=$(curl -fsS -X POST http://127.0.0.1:18080/api/auth/refresh \
            -H 'Content-Type: application/json' \
            -d "$(jq -nc --arg token "$refresh_token" '{refreshToken:$token}')")
          printf '%s' "$refreshed" | jq -e '.accessToken and .refreshToken' >/dev/null

      - name: Verify MongoDB backup and restore round-trip
        run: |
          set -euo pipefail
          set -a
          . ./.env
          set +a
          db_name=${MONGODB_DB:-bee_core}
          restore_db="${db_name}_restore_ci"
          mongo_auth=(--username "$MONGO_ROOT_USERNAME" --password "$MONGO_ROOT_PASSWORD" --authenticationDatabase admin)
          docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T mongodb mongosh --quiet "${mongo_auth[@]}" --eval "db.getSiblingDB('${db_name}').backup_restore_probe.replaceOne({_id:'ci-roundtrip'},{_id:'ci-roundtrip',verified:true},{upsert:true})"
          mongodb_id=$(docker compose -f docker-compose.yml -f docker-compose.prod.yml ps -q mongodb)
          network=$(docker inspect "$mongodb_id" --format '{{range $name, $_ := .NetworkSettings.Networks}}{{$name}}{{end}}')
          test -n "$network"
          mkdir -p "$RUNNER_TEMP/bee-backups"
          tools_version=100.12.2
          tools_archive="$RUNNER_TEMP/mongodb-database-tools.tgz"
          curl -fsSL "https://fastdl.mongodb.org/tools/db/mongodb-database-tools-ubuntu2204-x86_64-${tools_version}.tgz" -o "$tools_archive"
          tar -xzf "$tools_archive" -C "$RUNNER_TEMP"
          tools_dir="$RUNNER_TEMP/mongodb-database-tools-ubuntu2204-x86_64-${tools_version}/bin"
          test -x "$tools_dir/mongodump"
          test -x "$tools_dir/mongorestore"
          docker run --rm --network "$network" -e MONGO_ROOT_USERNAME -e MONGO_ROOT_PASSWORD -e MONGODB_DB -v "$RUNNER_TEMP/bee-backups:/backup" -v "$tools_dir:/tools:ro" ubuntu:22.04 bash -euc '
            /tools/mongodump --host mongodb:27017 --username "$MONGO_ROOT_USERNAME" --password "$MONGO_ROOT_PASSWORD" --authenticationDatabase admin --db "$MONGODB_DB" --archive=/backup/bee-core.archive --gzip
          '
          docker run --rm --network "$network" -e MONGO_ROOT_USERNAME -e MONGO_ROOT_PASSWORD -e MONGODB_DB -e RESTORE_DB="$restore_db" -v "$RUNNER_TEMP/bee-backups:/backup" -v "$tools_dir:/tools:ro" ubuntu:22.04 bash -euc '
            /tools/mongorestore --host mongodb:27017 --username "$MONGO_ROOT_USERNAME" --password "$MONGO_ROOT_PASSWORD" --authenticationDatabase admin --archive=/backup/bee-core.archive --gzip --nsInclude="$MONGODB_DB.*" --nsFrom="$MONGODB_DB.*" --nsTo="$RESTORE_DB.*"
          '
          docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T mongodb mongosh --quiet "${mongo_auth[@]}" --eval "const restored=db.getSiblingDB('${restore_db}'); const probe=restored.backup_restore_probe.findOne({_id:'ci-roundtrip'}); if(!probe || probe.verified !== true) throw new Error('Backup restore verification failed'); print('PASS authenticated MongoDB backup/restore round-trip');"
          docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T mongodb mongosh --quiet "${mongo_auth[@]}" --eval "db.getSiblingDB('${restore_db}').dropDatabase()"

      - name: Collect diagnostics on failure
        if: failure()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.prod.yml ps
          docker compose -f docker-compose.yml -f docker-compose.prod.yml logs --no-color

      - name: Tear down isolated stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml down -v
