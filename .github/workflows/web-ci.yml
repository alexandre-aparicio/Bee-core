name: Bee-Core Angular CI
on:
  pull_request:
    paths:
      - "apps/web/**"
      - "src/**"
      - "test/**"
      - "package.json"
      - "package-lock.json"
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "src/**"
      - "test/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

jobs:
  angular:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
      - name: Install backend dependencies from lockfile
        working-directory: .
        run: npm ci
      - name: Build backend API
        working-directory: .
        run: npm run build
      - name: Start Mongo-backed API for browser tests
        working-directory: .
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/bee_core_ci
          MONGODB_DB: bee_core_ci
          JWT_SECRET: ci-only-secret-that-is-long-enough-for-bee-core-auth-tests-2026
          AUTH_ADMIN_EMAIL: ci-admin@example.test
          AUTH_ADMIN_PASSWORD: CI-Admin-Password-2026!
          AUTH_MFA_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
          BEE_MAIL_ENCRYPTION_KEY: ci-only-mail-encryption-key-for-browser-tests-2026
          PUBLIC_BASE_DOMAIN: 127.0.0.1
        run: |
          nohup npm start > "$RUNNER_TEMP/bee-core-api.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/bee-core-api.pid"
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/health >/dev/null; then
              echo "Mongo-backed Bee-Core API is healthy"
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/bee-core-api.log"
          exit 1
      - name: Install frontend dependencies from lockfile
        run: npm ci
      - name: Frontend production dependency audit
        run: npm run audit:production
      - name: Angular production build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser smoke tests against the API proxy
        run: npm run test:e2e
      - name: Collect API diagnostics on failure
        if: failure()
        run: cat "$RUNNER_TEMP/bee-core-api.log" || true
