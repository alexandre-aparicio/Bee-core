name: Bee-Core Angular CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  angular-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package.json
      - name: Install Angular dependencies
        run: npm install
      - name: Build Angular production bundle
        run: npm run build
