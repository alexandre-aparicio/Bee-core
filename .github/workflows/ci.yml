name: Bee-Core CI

on:
  pull_request:
    paths:
      - "src/**"
      - "test/**"
      - "apps/web/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - "Dockerfile"
      - "docker-compose*.yml"
      - ".env*.example"
      - ".github/workflows/ci.yml"
  push:
    branches: [main, security/hardening-92]
    paths:
      - "src/**"
      - "test/**"
      - "apps/web/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - "Dockerfile"
      - "docker-compose*.yml"
      - ".env*.example"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend typecheck, build and MongoDB auth tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies from lockfile
        run: npm ci
      - name: Production dependency audit
        run: npm audit --omit=dev
      - name: Type check
        run: npm run check
      - name: Build
        run: npm run build
      - name: Auth integration tests
        run: npm test
        env:
          MONGODB_TEST_URI: mongodb://localhost:27017

  docker-stack:
    name: Docker Compose full-stack integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Create isolated CI environment
        run: |
          cat > .env <<'EOF'
          JWT_SECRET=ci-only-secret-that-is-long-enough-for-bee-core-auth-tests-2026
          BEE_MAIL_ENCRYPTION_KEY=ci-only-mail-encryption-key-that-is-unique-for-tests-2026
          AUTH_ADMIN_EMAIL=ci-admin@bee-core.invalid
          AUTH_ADMIN_PASSWORD=CI-only-Password-2026!
          MONGODB_DB=bee_core_ci
          BEE_CORE_PORT=33000
          BEE_WEB_PORT=38080
          EOF
      - name: Build and start MongoDB, API and Angular web
        run: docker compose up --build -d
      - name: Wait for services
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:33000/health >/dev/null && curl --fail --silent http://localhost:38080/ >/dev/null; then
              exit 0
            fi
            sleep 3
          done
          docker compose ps
          docker compose logs --no-color
          exit 1
      - name: Verify API, plugin registry, Angular and Nginx API proxy
        run: |
          node --input-type=module <<'NODE'
          const checks = [
            ["API health", "http://localhost:33000/health"],
            ["Plugin registry", "http://localhost:33000/plugins"],
            ["Angular web", "http://localhost:38080/"],
            ["Nginx API proxy", "http://localhost:38080/api/health"]
          ];
          for (const [name, url] of checks) {
            const response = await fetch(url);
            if (!response.ok) throw new Error(`${name} failed: HTTP ${response.status}`);
            const body = await response.text();
            if (name === "Angular web" && !body.includes("<bee-root")) throw new Error("Angular bee-root element missing from served HTML");
            if (name === "Plugin registry" && !body.includes("auth")) throw new Error("Auth plugin missing from registry");
            console.log(`PASS ${name} (${response.status})`);
          }
          NODE
      - name: Verify real authentication and refresh-cookie rotation
        run: |
          node --input-type=module <<'NODE'
          const base = "http://localhost:33000";
          const cookieFrom = response => {
            const cookie = (response.headers.get("set-cookie") || "").split(";")[0].trim();
            return cookie.startsWith("bee_refresh=") ? cookie : "";
          };
          const login = await fetch(base + "/auth/login", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ email: "ci-admin@bee-core.invalid", password: "CI-only-Password-2026!", client: "dashboard" })
          });
          if (!login.ok) throw new Error(`Admin login failed: HTTP ${login.status} ${await login.text()}`);
          const tokens = await login.json();
          const loginCookie = cookieFrom(login);
          const loginSetCookie = login.headers.get("set-cookie") || "";
          if (!tokens.accessToken || !loginCookie) throw new Error("Dashboard login must return an access token and HttpOnly refresh cookie");
          if (!/HttpOnly/i.test(loginSetCookie) || !/SameSite=Strict/i.test(loginSetCookie) || !/Path=\/api\/auth/i.test(loginSetCookie)) throw new Error("Refresh cookie security attributes are missing");
          console.log("PASS dashboard login and HttpOnly refresh cookie");

          const me = await fetch(base + "/auth/me", { headers: { authorization: `Bearer ${tokens.accessToken}` } });
          if (!me.ok || !(await me.json()).authenticated) throw new Error("Authenticated /auth/me failed");
          console.log("PASS authenticated profile");
          const defaultPreferences = await fetch(base + "/templates/preferences", { headers: { authorization: `Bearer ${tokens.accessToken}` } });
          if (!defaultPreferences.ok) throw new Error("Template preferences read failed");
          const defaults = await defaultPreferences.json();
          if (defaults.selection?.public !== "aurora" || defaults.selection?.dashboard !== "midnight") throw new Error("Unexpected default template preferences");
          const savedPreferences = await fetch(base + "/templates/preferences", {
            method: "PUT",
            headers: { "content-type": "application/json", authorization: `Bearer ${tokens.accessToken}` },
            body: JSON.stringify({ public: "editorial", dashboard: "paper" })
          });
          if (!savedPreferences.ok) throw new Error("Template preferences save failed");
          const persistedPreferences = await fetch(base + "/templates/preferences", { headers: { authorization: `Bearer ${tokens.accessToken}` } });
          const persisted = await persistedPreferences.json();
          if (persisted.selection?.public !== "editorial" || persisted.selection?.dashboard !== "paper") throw new Error("Template preferences were not persisted");
          console.log("PASS MongoDB template preference persistence");

          const refresh = await fetch(base + "/auth/refresh", {
            method: "POST",
            headers: { "content-type": "application/json", cookie: loginCookie },
            body: "{}"
          });
          if (!refresh.ok) throw new Error("Refresh-cookie rotation failed");
          const rotated = await refresh.json();
          const rotatedCookie = cookieFrom(refresh);
          if (!rotated.accessToken || !rotatedCookie || rotatedCookie === loginCookie) throw new Error("Dashboard refresh cookie was not rotated");
          console.log("PASS HttpOnly refresh-cookie rotation");

          const replay = await fetch(base + "/auth/refresh", {
            method: "POST",
            headers: { "content-type": "application/json", cookie: loginCookie },
            body: "{}"
          });
          if (replay.status !== 401) throw new Error(`Replayed refresh cookie should return 401, got ${replay.status}`);
          console.log("PASS refresh-cookie replay rejection");

          const logout = await fetch(base + "/auth/logout", {
            method: "POST",
            headers: { authorization: `Bearer ${rotated.accessToken}`, cookie: rotatedCookie, "content-type": "application/json" },
            body: "{}"
          });
          if (!logout.ok) throw new Error("Logout failed");
          const afterLogout = await fetch(base + "/auth/refresh", {
            method: "POST",
            headers: { "content-type": "application/json", cookie: rotatedCookie },
            body: "{}"
          });
          if (afterLogout.status !== 401) throw new Error("Logged-out refresh cookie was not revoked");
          console.log("PASS logout and refresh-session revocation");
          NODE
      - name: Docker Compose diagnostics
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color
      - name: Stop stack
        if: always()
        run: docker compose down -v
