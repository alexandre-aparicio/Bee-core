name: CI

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "test/**"
      - "scripts/**"
      - "apps/web/**"
      - "package.json"
      - "package-lock.json"
      - "apps/web/package.json"
      - "apps/web/package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mongo:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MONGODB_TEST_URI: mongodb://localhost:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build backend
        run: npm run build
      - name: Tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test.log
      - name: Fail if any test was skipped
        shell: bash
        run: |
          grep -Eq '# skipped 0$' test.log || {
            echo "::error::Tests were skipped or the test summary was not found."
            exit 1
          }

  web:
    name: Angular web build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Production build
        run: npm run build
      - name: Validate Playwright test discovery
        if: steps.migration-state.outputs.run == 'true'
        run: npm run test:e2e -- --list
  angular-migration:
    name: Sequential Angular 19 to 22 migration rehearsal
    if: github.event_name == 'pull_request' && github.head_ref == 'security/angular-22-migration-runner'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - id: migration-state
        name: Check migration marker
        run: |
          if [ -f .angular-migration-complete ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
        working-directory: apps/web
      - uses: actions/setup-node@v4
        if: steps.migration-state.outputs.run == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install current lockfile
        if: steps.migration-state.outputs.run == 'true'
        run: npm ci
      - name: Migrate Angular core and CLI 19 to 20
        if: steps.migration-state.outputs.run == 'true'
        run: npx ng update @angular/core@20 @angular/cli@20
      - name: Migrate Angular CDK 19 to 20
        if: steps.migration-state.outputs.run == 'true'
        run: npx ng update @angular/cdk@20
      - name: Migrate Angular core and CLI 20 to 21
        if: steps.migration-state.outputs.run == 'true'
        run: npx ng update @angular/core@21 @angular/cli@21
      - name: Migrate Angular CDK 20 to 21
        if: steps.migration-state.outputs.run == 'true'
        run: npx ng update @angular/cdk@21
      - name: Migrate Angular core and CLI 21 to 22
        if: steps.migration-state.outputs.run == 'true'
        run: npx ng update @angular/core@22 @angular/cli@22
      - name: Migrate Angular CDK 21 to 22
        if: steps.migration-state.outputs.run == 'true'
        run: npx ng update @angular/cdk@22
      - name: Verify regenerated lockfile
        if: steps.migration-state.outputs.run == 'true'
        run: npm ci
      - name: Audit production dependencies
        if: steps.migration-state.outputs.run == 'true'
        run: npm run audit:production
      - name: Angular production build
        if: steps.migration-state.outputs.run == 'true'
        run: npm run build
      - name: Validate Playwright test discovery
        run: npm run test:e2e -- --list
      - name: Mark successful migration
        if: steps.migration-state.outputs.run == 'true' && success()
        run: touch .angular-migration-complete
      - name: Create migration patch artifact
        if: always()
        working-directory: .
        run: |
          set -euo pipefail
          git add -N apps/web || true
          git diff --binary HEAD -- apps/web > "$RUNNER_TEMP/angular-migration.patch"
          git diff --stat HEAD -- apps/web
          test -s "$RUNNER_TEMP/angular-migration.patch" || printf 'No Angular migration changes were produced.\n' > "$RUNNER_TEMP/angular-migration.patch"
      - name: Upload generated migration patch
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: angular-22-migration-patch
          path: ${{ runner.temp }}/angular-migration.patch
          retention-days: 7
