name: CI

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "test/**"
      - "scripts/**"
      - "apps/web/**"
      - "package.json"
      - "package-lock.json"
      - "apps/web/package.json"
      - "apps/web/package-lock.json"
      - "docs/**"
      - "tsconfig.json"
      - ".github/workflows/ci.yml"
  push:
    branches: [main, refactor/template-base-and-packages, integration/template-refactor-into-main, refactor/native-angular-plugin-runtime]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mongo:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MONGODB_TEST_URI: mongodb://localhost:27017
    steps:
      - uses: actions/checkout@v4
      - name: Audit generic plugin permission contract consumers
        run: git grep -n -E "getTenantPluginPermissions|PluginAccessService" -- src test || true
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build backend
        run: npm run build
      - name: Install web dependencies for signed remote package
        run: npm ci --prefix apps/web
      - name: Build Connected Devices federation remote
        run: node scripts/build-connected-devices-remote.mjs
      - name: Build Time Tracking federation remote
        run: node scripts/build-time-tracking-remote.mjs
      - name: Verify signed Documents package generation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p secrets
          trap 'rm -rf secrets artifacts' EXIT
          openssl genpkey -algorithm ed25519 -out secrets/plugin-publisher-private.pem
          openssl pkey -in secrets/plugin-publisher-private.pem -pubout -out secrets/plugin-publisher-public.pem
          node scripts/build-plugin-packages.mjs
          test -f artifacts/plugin-packages/connected-devices-0.3.2.zip
          test ! -f artifacts/plugin-packages/connected-devices-0.3.0.zip
          unzip -t artifacts/plugin-packages/connected-devices-0.3.2.zip
          unzip -p artifacts/plugin-packages/connected-devices-0.3.2.zip bee-plugin.json > /tmp/connected-devices-manifest.json
          unzip -p artifacts/plugin-packages/connected-devices-0.3.2.zip dist/plugins/connected-devices/connected-devices.routes.js > /tmp/connected-devices-routes.js
          node -e 'const m=require("/tmp/connected-devices-manifest.json"); const fs=require("node:fs"); const route=fs.readFileSync("/tmp/connected-devices-routes.js","utf8"); if(m.id!=="connected-devices"||m.version!=="0.3.2"||!m.package.signature||!route.includes("pairingSecret")||!route.includes("deviceCredential")) process.exit(1); console.log("Connected Devices 0.3.2 signed package and pairing contract verified")'
          unzip -t artifacts/plugin-packages/documents-0.1.5.zip
          unzip -p artifacts/plugin-packages/documents-0.1.5.zip bee-plugin.json > /tmp/documents-manifest.json
          node -e 'const m=require("/tmp/documents-manifest.json"); if(m.id!=="documents"||m.version!=="0.1.5"||m.package.signature==="PENDING_PUBLISHER_SIGNATURE"||!m.dependencies.some(d=>d.pluginId==="files")) process.exit(1); console.log("Documents 0.1.5 signed package verified")'
          test -f artifacts/plugin-packages/time-tracking-connected-0.1.3.zip
          test ! -f artifacts/plugin-packages/time-tracking-connected-0.1.2.zip
          unzip -t artifacts/plugin-packages/time-tracking-connected-0.1.3.zip
          unzip -p artifacts/plugin-packages/time-tracking-connected-0.1.3.zip bee-plugin.json > /tmp/time-tracking-connected-manifest.json
          unzip -p artifacts/plugin-packages/time-tracking-0.2.3.zip bee-plugin.json > /tmp/time-tracking-manifest.json
          node -e 'const c=require("/tmp/time-tracking-connected-manifest.json"); const t=require("/tmp/time-tracking-manifest.json"); const expected=["time-tracking-connected.clock-in","time-tracking-connected.clock-out","time-tracking-connected.records.read"]; if(c.id!=="time-tracking-connected"||c.version!=="0.1.3"||c.deviceConnector!==true||!c.package.signature||JSON.stringify(c.permissions.map(p=>p.key).sort())!==JSON.stringify(expected.sort())||Object.hasOwn(t,"deviceConnector")) process.exit(1); console.log("Time Tracking Connected 0.1.3 signed connector marker and permission set verified")'
      - name: Count TODO/FIXME/HACK markers (informational)
        continue-on-error: true
        run: node scripts/count-debt-markers.mjs
      - name: Tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test.log
      - name: Fail if any test was skipped
        shell: bash
        run: |
          grep -Eq '# skipped 0$' test.log || {
            echo "::error::Tests were skipped or the test summary was not found."
            exit 1
          }

  template-browser-tests:
    name: Template browser tests and screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build production Angular host
        run: npm run build
      - name: Build Connected Devices federation remote
        run: node ../../scripts/build-connected-devices-remote.mjs
      - name: Build Time Tracking federation remote
        run: node ../../scripts/build-time-tracking-remote.mjs
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run smoke and template browser tests; capture template screenshots
        run: npm run test:e2e -- e2e/smoke.spec.ts e2e/templates.spec.ts e2e/time-tracking.spec.ts e2e/connected-devices.spec.ts
      - name: Upload template screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bee-core-template-screenshots
          path: apps/web/test-results/template-screenshots/*.png
          if-no-files-found: warn
          retention-days: 14

  web:
    name: Angular web build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check template token contract and package manifests
        run: npm run check:template-tokens -- --contrast-blocking
      - name: Prove template package extensibility
        run: node --test scripts/check-extensibility.test.mjs
      - name: Audit style source
        run: npm run audit:styles -- --strict
      - name: Lint standalone application and asset CSS
        run: npm run lint:styles
      - name: Production build
        run: npm run build
      - name: Build Connected Devices federation remote
        run: node ../../scripts/build-connected-devices-remote.mjs
      - name: Build Time Tracking federation remote
        run: node ../../scripts/build-time-tracking-remote.mjs
      - name: Validate Playwright test discovery
        run: npm run test:e2e -- --list

  angular-migration:
    name: Sequential Angular 19 to 22 migration rehearsal
    if: github.event_name == 'pull_request' && github.head_ref == 'security/angular-22-migration-runner'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - id: migration-state
        name: Check migration marker
        run: |
          if [ -f .angular-migration-complete ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
        working-directory: apps/web
      - uses: actions/setup-node@v4
        if: steps.migration-state.outputs.run == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install current lockfile
        if: steps.migration-state.outputs.run == 'true'
        run: npm ci
      - name: Capture migration baseline and configure temporary git identity
        if: steps.migration-state.outputs.run == 'true'
        run: |
          echo "MIGRATION_BASE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        working-directory: .
      - name: Migrate Angular core and CLI 19 to 20
        if: steps.migration-state.outputs.run == 'true'
        run: |
          npx ng update @angular/core@20 @angular/cli@20
          git -C "$GITHUB_WORKSPACE" add -A
          git -C "$GITHUB_WORKSPACE" commit -m "temp: migrate Angular core and CLI to 20"
          test -z "$(git -C "$GITHUB_WORKSPACE" status --porcelain)"
      - name: Migrate Angular CDK 19 to 20
        if: steps.migration-state.outputs.run == 'true'
        run: |
          npx ng update @angular/cdk@20
          git -C "$GITHUB_WORKSPACE" add -A
          git -C "$GITHUB_WORKSPACE" commit -m "temp: migrate Angular CDK to 20"
          test -z "$(git -C "$GITHUB_WORKSPACE" status --porcelain)"
      - name: Migrate Angular core and CLI 20 to 21
        if: steps.migration-state.outputs.run == 'true'
        run: |
          npx ng update @angular/core@21 @angular/cli@21
          git -C "$GITHUB_WORKSPACE" add -A
          git -C "$GITHUB_WORKSPACE" commit -m "temp: migrate Angular core and CLI to 21"
          test -z "$(git -C "$GITHUB_WORKSPACE" status --porcelain)"
      - name: Migrate Angular CDK 20 to 21
        if: steps.migration-state.outputs.run == 'true'
        run: |
          npx ng update @angular/cdk@21
          git -C "$GITHUB_WORKSPACE" add -A
          git -C "$GITHUB_WORKSPACE" commit -m "temp: migrate Angular CDK to 21"
          test -z "$(git -C "$GITHUB_WORKSPACE" status --porcelain)"
      - name: Migrate Angular core and CLI 21 to 22
        if: steps.migration-state.outputs.run == 'true'
        run: |
          test -z "$(git -C "$GITHUB_WORKSPACE" status --porcelain)"
          npx ng update @angular/core@22 @angular/cli@22 --allow-dirty
          git -C "$GITHUB_WORKSPACE" add -A
          git -C "$GITHUB_WORKSPACE" commit -m "temp: migrate Angular core and CLI to 22"
          test -z "$(git -C "$GITHUB_WORKSPACE" status --porcelain)"
      - name: Migrate Angular CDK 21 to 22
        if: steps.migration-state.outputs.run == 'true'
        run: |
          npx ng update @angular/cdk@22
          git -C "$GITHUB_WORKSPACE" add -A
          git -C "$GITHUB_WORKSPACE" commit -m "temp: migrate Angular CDK to 22"
          test -z "$(git -C "$GITHUB_WORKSPACE" status --porcelain)"
      - name: Verify regenerated lockfile
        if: steps.migration-state.outputs.run == 'true'
        run: npm ci
      - name: Audit production dependencies
        if: steps.migration-state.outputs.run == 'true'
        run: npm run audit:production
      - name: Angular production build
        if: steps.migration-state.outputs.run == 'true'
        run: npm run build
      - name: Validate Playwright test discovery
        run: npm run test:e2e -- --list
      - name: Mark successful migration
        if: steps.migration-state.outputs.run == 'true' && success()
        run: touch .angular-migration-complete
      - name: Create migration patch artifact
        if: always()
        working-directory: .
        run: |
          set -euo pipefail
          rm -f apps/web/.angular-migration-complete
          git add -N apps/web || true
          git diff --binary "$MIGRATION_BASE" -- apps/web > "$RUNNER_TEMP/angular-migration.patch"
          git diff --stat "$MIGRATION_BASE" -- apps/web
          test -s "$RUNNER_TEMP/angular-migration.patch" || printf 'No Angular migration changes were produced.\n' > "$RUNNER_TEMP/angular-migration.patch"
      - name: Upload generated migration patch
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: angular-22-migration-patch
          path: ${{ runner.temp }}/angular-migration.patch
          retention-days: 7
      - name: Publish verified Angular 22 branch
        if: steps.migration-state.outputs.run == 'true' && success()
        working-directory: .
        env:
          TARGET_BRANCH: security/angular-22-migrated-${{ github.run_id }}
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/angular-migration.patch"
          git fetch origin main
          git switch --detach origin/main
          git switch -c "$TARGET_BRANCH"
          git apply "$RUNNER_TEMP/angular-migration.patch"
          sed -i 's/^FROM node:22-alpine AS build$/FROM node:22.22.3-alpine AS build/' apps/web/Dockerfile
          grep -Fqx 'FROM node:22.22.3-alpine AS build' apps/web/Dockerfile
          git add apps/web
          git commit -m "security(web): migrate Angular to 22 and pin Node 22.22.3"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          echo "Published $TARGET_BRANCH"
