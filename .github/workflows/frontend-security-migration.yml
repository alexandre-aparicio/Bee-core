name: Frontend security migration (manual)
# Keep generated migration changes in the same reviewed branch.
# Normalize generated whitespace before diff validation.

on:
  push:
    branches: [security/hardening-92, fix/frontend-security-migration-bootstrap, ci/web-e2e-api-proxy]
    paths:
      - .github/workflows/frontend-security-migration.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frontend-security-migration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrate-and-verify:
    name: Angular 19 → 20 → 21 → 22
    if: github.ref == 'refs/heads/security/hardening-92' || github.ref == 'refs/heads/fix/frontend-security-migration-bootstrap' || github.ref == 'refs/heads/ci/web-e2e-api-proxy'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout security branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Verify target branch
        run: |
          test "${GITHUB_REF_NAME}" = "security/hardening-92" || test "${GITHUB_REF_NAME}" = "fix/frontend-security-migration-bootstrap" || test "${GITHUB_REF_NAME}" = "ci/web-e2e-api-proxy"
          test "$(git branch --show-current)" = "${GITHUB_REF_NAME}"

      - name: Set up supported Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install baseline dependencies for Angular CLI
        run: npm ci

      - name: Show starting toolchain
        run: |
          node --version
          npm --version
          npm exec -- ng version

      - name: Apply Angular 20 migrations
        run: CI=true npm exec -- ng update @angular/core@20 @angular/cli@20 --allow-dirty

      - name: Apply Angular 21 migrations
        run: CI=true npm exec -- ng update @angular/core@21 @angular/cli@21 --allow-dirty

      - name: Apply Angular 22 migrations
        run: CI=true npm exec -- ng update @angular/core@22 @angular/cli@22 --allow-dirty

      - name: Pin Docker build Node.js to the Angular 22 minimum
        run: sed -i '1s#node:22-alpine#node:22.22.3-alpine#' Dockerfile

      - name: Validate generated lockfile from a clean install
        run: npm ci

      - name: Production dependency security audit
        run: npm run audit:production

      - name: Normalize whitespace in generated Angular migrations
        working-directory: .
        run: |
          while IFS= read -r -d '' file; do
            sed -i 's/[[:space:]]*$//' "$file"
          done < <(git diff --name-only -z -- apps/web)

      - name: Check patch formatting
        working-directory: .
        run: git diff --check -- apps/web

      - name: Build Angular production bundle
        run: npm run build

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Install backend dependencies from lockfile
        working-directory: .
        run: npm ci

      - name: Build backend API
        working-directory: .
        run: npm run build

      - name: Start Mongo-backed API for browser acceptance
        working-directory: .
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/bee_core_ci
          MONGODB_DB: bee_core_ci
          JWT_SECRET: ci-only-secret-that-is-long-enough-for-bee-core-auth-tests-2026
          AUTH_ADMIN_EMAIL: ci-admin@example.test
          AUTH_ADMIN_PASSWORD: CI-Admin-Password-2026!
          AUTH_MFA_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
          BEE_MAIL_ENCRYPTION_KEY: ci-only-mail-encryption-key-for-browser-tests-2026
          PUBLIC_BASE_DOMAIN: 127.0.0.1
        run: |
          nohup npm start > "$RUNNER_TEMP/bee-core-api.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/bee-core-api.pid"
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/health >/dev/null; then
              echo "Mongo-backed Bee-Core API is healthy"
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/bee-core-api.log"
          exit 1

      - name: Run frontend browser acceptance tests
        run: npm run test:e2e

      - name: Collect API diagnostics on failure
        if: failure()
        working-directory: .
        run: cat "$RUNNER_TEMP/bee-core-api.log" || true

      - name: Commit verified migration on the security branch
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web
          if git diff --cached --quiet; then
            echo "No migration changes to commit."
            exit 0
          fi
          git commit -m "security(frontend): migrate Angular to supported release"
          git push origin "HEAD:${GITHUB_REF_NAME}"
