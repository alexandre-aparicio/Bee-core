name: Frontend security migration (manual)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frontend-security-migration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrate-and-verify:
    name: Angular 19 → 20 → 21 → 22
    if: github.ref == 'refs/heads/security/hardening-92'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout security branch
        uses: actions/checkout@v4
        with:
          ref: security/hardening-92
          fetch-depth: 0

      - name: Verify target branch
        run: |
          test "${GITHUB_REF}" = "refs/heads/security/hardening-92"
          test "$(git branch --show-current)" = "security/hardening-92"

      - name: Set up supported Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Show starting toolchain
        run: |
          node --version
          npm --version
          npx ng version

      - name: Apply Angular 20 migrations
        run: npx ng update @angular/core@20 @angular/cli@20 --interactive=false

      - name: Apply Angular 21 migrations
        run: npx ng update @angular/core@21 @angular/cli@21 --interactive=false

      - name: Apply Angular 22 migrations
        run: npx ng update @angular/core@22 @angular/cli@22 --interactive=false

      - name: Pin Docker build Node.js to the Angular 22 minimum
        run: sed -i '1s#node:22-alpine#node:22.22.3-alpine#' Dockerfile

      - name: Validate generated lockfile from a clean install
        run: npm ci

      - name: Production dependency security audit
        run: npm run audit:production

      - name: Check patch formatting
        run: git diff --check

      - name: Build Angular production bundle
        run: npm run build

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Run frontend browser acceptance tests
        run: npm run test:e2e

      - name: Commit verified migration on the security branch
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/package.json apps/web/package-lock.json apps/web/Dockerfile
          if git diff --cached --quiet; then
            echo "No migration changes to commit."
            exit 0
          fi
          git commit -m "security(frontend): migrate Angular to supported release"
          git push origin HEAD:security/hardening-92
