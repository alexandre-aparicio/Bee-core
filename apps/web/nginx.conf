map $http_x_forwarded_proto $hsts_header {
 default "";
 https "max-age=31536000; includeSubDomains";
}

limit_req_zone $binary_remote_addr zone=auth_login:10m rate=5r/m;

server {
 listen 80;
 server_name _;
 server_tokens off;
 root /usr/share/nginx/html;
 index index.html;
 client_max_body_size 1m;
 limit_req_status 429;

 add_header X-Content-Type-Options "nosniff" always;
 add_header X-Frame-Options "DENY" always;
 add_header Referrer-Policy "strict-origin-when-cross-origin" always;
 add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
 add_header Strict-Transport-Security $hsts_header always;
 add_header X-Permitted-Cross-Domain-Policies "none" always;
 add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; manifest-src 'self'; worker-src 'self' blob:;" always;
 add_header Cross-Origin-Opener-Policy "same-origin" always;
 add_header Cross-Origin-Resource-Policy "same-origin" always;

 location = /api/auth/login {
   limit_req zone=auth_login burst=5 nodelay;
   proxy_pass http://bee-core:3000/auth/login;
   proxy_http_version 1.1;
   proxy_set_header Host $host;
   proxy_set_header X-Real-IP $remote_addr;
   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
   proxy_set_header X-Forwarded-Proto $scheme;
 }

 location = /api/auth/mfa/confirm {
   limit_req zone=auth_login burst=3 nodelay;
   proxy_pass http://bee-core:3000/auth/mfa/confirm;
   proxy_http_version 1.1;
   proxy_set_header Host $host;
   proxy_set_header X-Real-IP $remote_addr;
   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
   proxy_set_header X-Forwarded-Proto $scheme;
 }

 location = /api/files {
   # Allow a 10 MiB file plus multipart/form-data overhead.
   client_max_body_size 11m;
   proxy_pass http://bee-core:3000/files;
   proxy_http_version 1.1;
   proxy_set_header Host $host;
   proxy_set_header X-Real-IP $remote_addr;
   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
   proxy_set_header X-Forwarded-Proto $scheme;
 }

 location = /api/realtime {
   proxy_pass http://bee-core:3000/realtime;
   proxy_http_version 1.1;
   proxy_set_header Upgrade $http_upgrade;
   proxy_set_header Connection "upgrade";
   proxy_set_header Host $host;
   proxy_set_header X-Real-IP $remote_addr;
   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
   proxy_read_timeout 3600s;
 }

 location /api/ {
   proxy_pass http://bee-core:3000/;
   proxy_http_version 1.1;
   proxy_set_header Host $host;
   proxy_set_header X-Real-IP $remote_addr;
   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
   proxy_set_header X-Forwarded-Proto $scheme;
 }
 location / { try_files $uri $uri/ /index.html; }
}