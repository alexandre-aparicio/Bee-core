<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Control horario · Bee Core</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#182230;background:#f7f8fa}
*{box-sizing:border-box}body{margin:0;padding:28px}.page{max-width:1120px;margin:0 auto;display:grid;gap:20px}.header,.section-heading,.clock-top,.history-row{display:flex;align-items:center;justify-content:space-between;gap:16px}.header h1{margin:4px 0;font-size:29px;letter-spacing:-.03em}.header p,.section-heading p,.clock p{color:#667085;margin:5px 0}.eyebrow{font-size:10px;letter-spacing:.13em;color:#8b95a5;font-weight:750;margin:0 0 7px}.btn{border:1px solid #d7dce3;border-radius:9px;padding:10px 15px;background:#fff;color:#344054;font:inherit;font-size:12px;font-weight:650;cursor:pointer}.btn.primary{background:#6752d8;border-color:#6752d8;color:#fff}.btn:disabled{opacity:.5;cursor:not-allowed}.message,.error{padding:12px 14px;border-radius:9px;font-size:12px}.message{background:#ecfdf3;color:#067647}.error{background:#fff1f1;color:#b42318}.content{display:grid;gap:16px}.content-heading h2{margin:3px 0 6px;font-size:22px}.content-heading p:last-child{margin:0;color:#667085;font-size:13px}.tabs{display:flex;gap:8px;flex-wrap:wrap;border-bottom:1px solid #e4e7ec;padding-bottom:10px}.tabs button{border:1px solid #e4e7ec;border-radius:9px;padding:9px 13px;background:transparent;color:#344054;font:inherit;font-size:12px;cursor:pointer}.tabs button.active{background:#f0edff;border-color:#6752d8;color:#6752d8;font-weight:700}.panel{padding:22px;border:1px solid #e4e7ec;border-radius:14px;background:#fff}.clock-top{font-size:11px;font-weight:750;letter-spacing:.1em;color:#667085}.status{display:inline-flex;border:1px solid #e4e7ec;border-radius:999px;padding:5px 10px;font-size:11px;color:#667085;letter-spacing:0}.status.working{color:#16845c;border-color:#a6e3c4;background:#effaf4}.status.break{color:#a56a0a;border-color:#f3d39b;background:#fff8e9}.clock-time{font-size:clamp(30px,5vw,48px);font-weight:750;letter-spacing:-.04em;margin:22px 0 5px}.clock p{font-size:12px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:20px}.section-heading h3{margin:0;font-size:16px}.section-heading p{font-size:12px}.events{display:grid;margin-top:14px}.event{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid #eaecf0}.dot{width:9px;height:9px;border-radius:50%;background:#6752d8}.event div,.history-row div{display:grid;gap:4px}.event small,.history-row small{color:#667085;font-size:11px}.source{margin-left:auto;color:#667085;font-size:11px}.history-row{padding:14px 0;border-bottom:1px solid #eaecf0;align-items:flex-start}.row-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.link{border:0;background:none;color:#6752d8;font:inherit;font-size:12px;cursor:pointer;padding:4px}.field{display:grid;gap:7px;margin:13px 0;color:#667085;font-size:12px;font-weight:650}.field input,.field select,.field textarea{width:100%;min-width:0;border:1px solid #d0d5dd;border-radius:8px;padding:10px;background:#fff;color:#182230;font:inherit}.table-wrap{width:100%;overflow:auto;border:1px solid #e4e7ec;border-radius:12px;margin-top:16px}.table{width:100%;border-collapse:collapse;text-align:left;white-space:nowrap}.table th,.table td{padding:12px 14px;border-bottom:1px solid #eaecf0}.table thead th{background:#f8f9fb;color:#667085;font-size:11px}.table tbody th{font-weight:650}.table tbody tr:last-child th,.table tbody tr:last-child td{border-bottom:0}.table input:not([type=checkbox]){min-width:100px;width:100%;border:1px solid #d0d5dd;border-radius:7px;padding:8px;background:#fff;color:#182230;font:inherit}.table input:disabled{opacity:.45}.correction{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:15px 0;border-bottom:1px solid #eaecf0}.correction>div:first-child{display:grid;gap:6px}.correction p{margin:0;color:#344054;font-size:12px}.correction small{color:#667085;font-size:11px}.empty{padding:38px;text-align:center;border:1px dashed #d0d5dd;border-radius:12px;color:#667085;font-size:12px}.modal-backdrop{position:fixed;inset:0;z-index:20;background:#10182899;display:grid;place-items:center;padding:18px}.modal{width:min(520px,100%);padding:23px;border-radius:16px;background:#fff;box-shadow:0 24px 70px #0004}.modal h2{margin:0 0 8px;font-size:18px}.modal p{margin:0;color:#667085;font-size:12px;line-height:1.6}.modal-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}@media(max-width:680px){body{padding:16px}.header{align-items:flex-start;flex-direction:column}.history-row,.correction{align-items:flex-start;flex-direction:column}.panel{padding:17px}.modal{padding:18px}}
</style></head>
<body><main class="page">
<header class="header"><div><p class="eyebrow">WORKSPACE / PERSONAS</p><h1>Control horario</h1><p>Registra tu jornada, consulta horarios y gestiona incidencias.</p></div><button class="btn" id="refresh">Actualizar</button></header>
