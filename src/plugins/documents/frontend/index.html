<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Documents · Bee Core</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#182230;background:#f7f8fa;font-synthesis:none}
*{box-sizing:border-box}body{margin:0;padding:28px}.workspace{max-width:1180px;margin:0 auto}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:24px}.eyebrow{font-size:11px;letter-spacing:.12em;font-weight:700;color:#8b95a5;margin:0 0 8px}.top h1{font-size:28px;margin:0 0 6px}.sub{color:#667085;margin:0}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid #d7dce3;background:white;border-radius:9px;padding:10px 14px;font-weight:600;color:#344054;cursor:pointer}.btn.primary{background:#ed7b22;color:white;border-color:#ed7b22}.btn:disabled{opacity:.55;cursor:wait}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px 16px;background:white;border:1px solid #e4e7ec;border-radius:12px;margin-bottom:18px}.crumbs{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.crumbs button{border:0;background:none;color:#475467;padding:3px;cursor:pointer}.crumbs button.current{font-weight:700;color:#182230}.upload{display:flex;gap:8px;align-items:center}.upload input{max-width:220px}.notice{padding:12px 14px;border-radius:9px;margin:0 0 14px;background:#fff4e8;color:#9a4b0b}.notice.success{background:#ecfdf3;color:#067647}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}.item{background:white;border:1px solid #e4e7ec;border-radius:12px;padding:16px;min-width:0}.item.folder{cursor:pointer}.item h3{font-size:15px;margin:0 0 7px;overflow-wrap:anywhere}.meta{font-size:12px;color:#667085;line-height:1.5}.item-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}.item-actions .btn{font-size:12px;padding:7px 9px}.empty{padding:42px;text-align:center;background:white;border:1px dashed #d0d5dd;border-radius:12px;color:#667085}.create{display:flex;gap:8px;margin:0 0 18px}.create input{flex:1;min-width:0;border:1px solid #d0d5dd;border-radius:9px;padding:10px}.overlay{position:fixed;inset:0;z-index:20;background:#10182888;display:grid;place-items:center;padding:18px}.dialog{width:min(620px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:16px;padding:22px;box-shadow:0 24px 64px #10182833}.dialog h2{margin:0 0 8px}.dialog p{color:#667085}.dialog-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.dialog-search{display:flex;gap:8px;margin:16px 0}.dialog-search input,.dialog-search select{min-width:0;border:1px solid #d0d5dd;border-radius:8px;padding:9px}.dialog-search input{flex:1}.results{display:grid;gap:6px;margin:8px 0 18px}.result{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 10px;border:1px solid #eaecf0;border-radius:8px}.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 16px}.chip{border:1px solid #d0d5dd;background:#f9fafb;border-radius:999px;padding:6px 10px;font-size:12px}.chip button{border:0;background:none;margin-left:5px;cursor:pointer}.details{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}.details div{padding:10px;background:#f9fafb;border-radius:8px}.details dt{font-size:11px;color:#667085}.details dd{margin:4px 0 0;overflow-wrap:anywhere}.dialog-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.hidden{display:none!important}@media(max-width:700px){body{padding:16px}.top,.toolbar{align-items:stretch;flex-direction:column}.actions{justify-content:flex-start}.upload{align-items:stretch;flex-direction:column}.upload input{max-width:none}}
</style>
</head>
<body>
<main class="workspace">
<header class="top"><div><p class="eyebrow">WORKSPACE / LIBRARY</p><h1>Documents</h1><p class="sub">Organize company documents and folders in one secure workspace.</p></div><div class="actions"><button class="btn" id="refresh">Refresh</button><button class="btn primary" id="new-folder">New folder</button></div></header>
<div id="notice" class="notice hidden" role="status"></div>
<form id="create" class="create hidden"><input id="folder-name" maxlength="120" placeholder="Folder name" required aria-label="Folder name"><button class="btn primary" type="submit">Create folder</button><button class="btn" id="cancel-folder" type="button">Cancel</button></form>
<nav class="toolbar" aria-label="Document location"><div class="crumbs" id="crumbs"><button class="current" data-folder="">All documents</button></div><div class="upload"><input id="file" type="file" accept=".txt,text/plain" aria-label="Choose text file"><button class="btn primary" id="upload" type="button">Upload text file</button></div></nav>
<section id="content" aria-live="polite"><div class="empty">Loading documents…</div></section>\n<div id="dialog-root"></div>
</main>
<script type="module" src="main.js"></script>
</body>
</html>
