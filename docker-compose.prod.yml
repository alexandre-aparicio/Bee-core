services:
  mongodb:
    ports: !reset []
    restart: unless-stopped

  bee-core:
    ports: !reset []
    expose:
      - "3000"
    environment:
      NODE_ENV: production
    restart: unless-stopped

  web:
    # Dedicated host port for Nginx Proxy Manager; never bind public 80/443 here.
    ports:
      - "${BEE_WEB_PORT:-3011}:80"
    restart: unless-stopped
